<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Infinite Night</title>
  <desc id="desc">Une lune violette éclaire une porte gothique et une silhouette au milieu d’une arène obscure.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.9" y2="1">
      <stop stop-color="#302048"/>
      <stop offset=".55" stop-color="#15101f"/>
      <stop offset="1" stop-color="#08070d"/>
    </linearGradient>
    <radialGradient id="moon" cx=".38" cy=".32" r=".7">
      <stop stop-color="#f1e4ff"/>
      <stop offset=".58" stop-color="#c8a4ff"/>
      <stop offset="1" stop-color="#8e64bf"/>
    </radialGradient>
    <linearGradient id="gate" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#a477bc" stop-opacity=".7"/>
      <stop offset="1" stop-color="#342447" stop-opacity=".22"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#241a32" stop-opacity=".15"/>
      <stop offset="1" stop-color="#07060a" stop-opacity=".95"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="450" fill="url(#sky)"/>
  <circle cx="605" cy="104" r="78" fill="#a875df" opacity=".18" filter="url(#glow)"/>
  <circle cx="605" cy="104" r="47" fill="url(#moon)"/>
